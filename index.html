<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGI Retail · Gestión de Inventarios</title>
  <meta name="description" content="Sistema de gestión de inventarios para tienda minorista: control de stock, registro de ventas y reportes.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="assets/favicon.svg" alt="" width="34" height="34">
        <div>
          <strong>SIGI Retail</strong>
          <small id="storeName">Minimarket Sumaq</small>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">v1.0.0 · Release 1</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn-icon menu" id="menuBtn" aria-label="Menú">☰</button>
        <div>
          <h1 id="pageTitle">Panel principal</h1>
          <p id="pageSubtitle" class="muted"></p>
        </div>
        <div class="topbar-right">
          <span class="chip" id="lowStockChip" title="Productos en o bajo el stock mínimo"></span>
          <span class="user"><span class="avatar">AD</span> Administrador</span>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <header><h2 id="modalTitle"></h2><button class="btn-icon" data-close aria-label="Cerrar">✕</button></header>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
